name: MicroSuite CI

on:
  push:
    paths: ["microsaas/**", ".github/workflows/microsuite.yml"]
  pull_request:
    paths: ["microsaas/**", ".github/workflows/microsuite.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: tsuite
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U t" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: microsaas/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: microsaas/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas (SQLite)
        run: pytest -q
      - name: Pruebas (PostgreSQL + migraciones)
        env:
          DATABASE_URL: postgresql+psycopg://t:t@localhost:5432/tsuite
        run: pytest -q
      - name: Modelos y migraciones sincronizados
        env:
          DATABASE_URL: postgresql+psycopg://t:t@localhost:5432/tsuite
        run: alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microsaas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: microsaas/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: microsaas
    steps:
      - uses: actions/checkout@v4
      - name: Construir imágenes
        run: cp .env.example .env && docker compose build
