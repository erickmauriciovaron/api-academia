# Nginx interno del contenedor `web`: sirve la SPA y reenvía /api al backend.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Límite anti fuerza bruta solo en endpoints de credenciales
    location ~ ^/api/auth/(login|signup|forgot|reset)$ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_params_suite;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_read_timeout 180s;
        include /etc/nginx/proxy_params_suite;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
