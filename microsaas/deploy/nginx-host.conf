# /etc/nginx/sites-available/microsuite  (Nginx del Droplet, junto a tus otras apps)
# 1) sudo ln -s /etc/nginx/sites-available/microsuite /etc/nginx/sites-enabled/
# 2) sudo nginx -t && sudo systemctl reload nginx
# 3) sudo certbot --nginx -d suite.tudominio.com   (agrega aquí también los dominios propios de cada app)

server {
    listen 80;
    server_name suite.tudominio.com;
    # Dominios propios opcionales (deben estar también en PRODUCT_DOMAINS):
    # server_name suite.tudominio.com licencialens.com www.licencialens.com venceya.app;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sobrescribe (no agrega) para que la IP registrada en evidencias no pueda falsificarse
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
